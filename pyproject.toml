[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marksapp"
version = "0.1.0"
description = "Send each student's exam marks to their parent on WhatsApp, after review."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["marksapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
